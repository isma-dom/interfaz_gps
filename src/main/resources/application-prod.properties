# Producción: sin valores por omisión; si falta una variable, la aplicación no arranca.
spring.datasource.url=${SIGIT_DB_URL}
spring.datasource.username=${SIGIT_DB_USUARIO}
spring.datasource.password=${SIGIT_DB_PASSWORD}
spring.docker.compose.enabled=false
# Con HTTPS, la cookie de sesión no viaja por HTTP.
sigit.sesion.cookie-segura=true
