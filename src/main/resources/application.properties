spring.application.name=sigit

# Base de datos. En producción se toman de variables de entorno (ver application-prod.properties).
spring.datasource.url=${SIGIT_DB_URL:jdbc:mysql://localhost:3306/sigit_dev}
spring.datasource.username=${SIGIT_DB_USUARIO:sigit}
spring.datasource.password=${SIGIT_DB_PASSWORD:sigit}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Interfaz en español
spring.web.locale=es_MX
spring.web.locale-resolver=fixed
spring.messages.basename=mensajes
spring.messages.fallback-to-system-locale=false
# Tarea 6 (D-07, D-09): en Spring Boot 4 estas propiedades son spring.web.error.*; las server.error.* ya no
# tienen efecto. Las respuestas de error nunca llevan la traza ni el mensaje interno, en ningún perfil.
spring.web.error.whitelabel.enabled=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# La sesión (30 minutos) y su cookie las configura ConfiguracionGeneral, para que apliquen
# igual en el Tomcat embebido y en el Tomcat externo.
server.servlet.session.tracking-modes=cookie

# Reglas del módulo de seguridad
sigit.bloqueo.intentos=5
# Supuesto por confirmar con el Product Owner: los documentos solo dicen «temporal».
sigit.bloqueo.minutos=${SIGIT_BLOQUEO_MINUTOS:15}
sigit.sesion.minutos=30
sigit.sesion.aviso-minutos=2
sigit.sesion.cookie-segura=false
# Contraseña de los usuarios de prueba del perfil dev. Sin valor, no se crean.
# RN-06: clasificación diaria de obsolescencia (a las 2:00 y al arrancar).
sigit.obsolescencia.anios=5
sigit.obsolescencia.so-sin-soporte=Windows 7,Windows 8.1,Windows 10
sigit.obsolescencia.cron=0 0 2 * * *
# Zona de las fechas que registra SIGIT, sin importar la del servidor (D-02).
sigit.zona-horaria=${SIGIT_ZONA_HORARIA:America/Merida}
# Dirección con la que se abre SIGIT desde un celular; va dentro de cada código QR (C-26).
# Vacía: se usa la dirección con la que se pidió la página.
sigit.url-publica=${SIGIT_URL_PUBLICA:}
sigit.seed-password=${SIGIT_SEED_PASSWORD:}
