<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/pagina :: pagina('Registrar nuevo equipo', ~{::#cerrar}, ~{::#cuerpo-pagina})}">
<body>
<a id="cerrar" class="tarjeta-formulario__cerrar" th:href="@{/equipos}" aria-label="Cerrar sin guardar">
    <i class="bi bi-x-lg" aria-hidden="true"></i>
</a>

<!--/* P-05: alta real de equipos (Tarea 2), con el diseño de tarjeta y secciones numeradas. */-->
<form id="cuerpo-pagina" method="post" th:action="@{/equipos}" novalidate>
    <div th:if="${registrado != null}" th:insert="~{equipos/inicio :: resumen}"></div>

    <div class="superficie estado-vacio" th:if="${areas.empty}">
        <h2 class="h5">Primero hace falta registrar las áreas</h2>
        <p class="mb-0">Cada equipo se ubica en un área, y todavía no hay ninguna. Se capturan en Catálogos.</p>
    </div>

    <div class="tarjeta-formulario" th:unless="${areas.empty}">
        <p class="introduccion-formulario">
            Los campos con <span class="obligatorio">*</span> son obligatorios. El sistema le asigna su código QR al guardar.
        </p>
        <div th:replace="~{equipos/formulario :: campos('Guardar equipo', true, '/equipos')}"></div>
    </div>
</form>
</body>
</html>
