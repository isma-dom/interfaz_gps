<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, mensaje)">
<head th:replace="~{fragmentos/cabeza :: cabeza(${titulo})}"></head>
<body>
<main class="pagina-error">
    <div class="pagina-error__contenido">
        <div class="titulo-pagina">
            <h1 th:text="${titulo}">Error</h1>
        </div>
        <p th:text="${mensaje}">Mensaje</p>
        <a class="btn btn-primary" th:href="@{/}">Ir a la página de inicio</a>
    </div>
</main>
</body>
</html>
