<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabeza :: cabeza('Inicia sesión')}"></head>
<body>
<main class="pagina-ficha">
    <!--/* P-01: una ficha del catálogo de la biblioteca, con renglones y perforación. */-->
    <div class="ficha" th:classappend="${errores == null and aviso == null} ? 'ficha--entra'">
        <div class="ficha__encabezado">
            <!--/* Sustituir por el logotipo oficial cuando el cliente lo entregue. */-->
            <span class="ficha__sigla">SIGIT</span>
            <span class="ficha__institucion">Biblioteca Benito Juárez<br>Inventario tecnológico</span>
        </div>

        <h1>Inicia sesión</h1>
        <p class="ficha__indicacion">Usa el correo y la contraseña que te dio Soporte Técnico.</p>

        <div aria-live="polite">
            <p class="ficha__aviso" role="status" th:if="${aviso}" th:text="${aviso}">Aviso</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="ficha__campo">
                <label class="form-label" for="correo">Correo</label>
                <input class="form-control" id="correo" name="correo" type="email"
                       th:classappend="${errores?.get('correo')} ? 'is-invalid'"
                       th:value="${correoAnterior}" autocomplete="username" inputmode="email" autocapitalize="none"
                       spellcheck="false" required th:autofocus="${errores?.get('password') == null}"
                       th:aria-invalid="${errores?.get('correo')} ? 'true'"
                       th:aria-describedby="${errores?.get('correo')} ? 'correo-error'">
                <p class="ficha__error" id="correo-error" role="alert" th:if="${errores?.get('correo')}"
                   th:text="${errores.get('correo')}">Error</p>
            </div>

            <div class="ficha__campo">
                <label class="form-label" for="password">Contraseña</label>
                <div class="ficha__contrasena">
                    <input class="form-control" id="password" name="password" type="password"
                           th:classappend="${errores?.get('password')} ? 'is-invalid'"
                           autocomplete="current-password" required
                           th:autofocus="${errores?.get('password') != null}"
                           th:aria-invalid="${errores?.get('password')} ? 'true'"
                           th:aria-describedby="${errores?.get('password')} ? 'password-error'">
                    <button class="boton-ver" type="button" data-ver-contrasena="password" aria-pressed="false"
                            aria-label="Mostrar contraseña">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="ficha__error" id="password-error" role="alert" th:if="${errores?.get('password')}"
                   th:text="${errores.get('password')}">Error</p>
            </div>

            <button class="btn btn-primary ficha__accion" type="submit">Entrar</button>
        </form>

        <p class="ficha__ayuda">¿No puedes entrar? Pide ayuda a Soporte Técnico.</p>
    </div>
</main>
</body>
</html>
